name: supplier-pages
# Reads retail prices from product pages listed in suppliers/pages/urls.txt (e.g. satro-paladin.com).
on:
  schedule:
    - cron: "37 3 * * *"    # 06:37 MSK
  push:
    branches: [main]
    paths:
      - suppliers/pages/urls.txt
      - work/fetch_pages.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: supplier-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python work/fetch_pages.py
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain suppliers/pages)" ]; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add suppliers/pages
          git commit -q -m "Supplier page prices: $(date -u +%F)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
