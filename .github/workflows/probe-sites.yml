name: probe-sites
on:
  push:
    branches: [probe/sites]
    paths: [probe/items.csv, .github/workflows/probe-sites.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match items against Tinko daily file
        env:
          UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
        run: |
          pip -q install openpyxl
          curl -sS -L -A "$UA" -o stock.xlsx https://www.tinko.ru/upload/exchange/public/price-stock/price.xlsx
          curl -sS -L -A "$UA" -o pricetin.xlsx https://www.tinko.ru/upload/exchange/public/pricelist/pricetin.xlsx
          python - > probe/match.txt 2>&1 <<'PY'
          import csv, re, openpyxl
          LAT = str.maketrans("АВЕКМНОРСТХУавекмнорстху", "ABEKMHOPCTXYabekmhopctxy")
          def n(s):
              s = str(s or "").translate(LAT).lower().replace("×", "x")
              return re.sub(r"[\s\-–—_.,()«»\"'/]", "", s)
          # VAT notes anywhere in the head of the price lists
          for f in ("pricetin.xlsx", "stock.xlsx"):
              wb = openpyxl.load_workbook(f, read_only=True, data_only=True)
              for ws in wb.worksheets[:2]:
                  for i, row in enumerate(ws.iter_rows(values_only=True)):
                      if i > 8: break
                      for c in row:
                          if c and "НДС" in str(c).upper(): print("VAT-NOTE", f, ws.title, c)
          wb = openpyxl.load_workbook("stock.xlsx", read_only=True, data_only=True)
          ws = wb.worksheets[0]
          rows = []
          for i, r in enumerate(ws.iter_rows(values_only=True)):
              if i < 4 or r[0] is None: continue
              rows.append(r)
          print("tinko rows:", len(rows))
          idx_trade, idx_art = {}, {}
          for r in rows:
              idx_trade.setdefault(n(r[4]), []).append(r)
              for a in (r[1], r[2]):
                  if a: idx_art.setdefault(n(a), []).append(r)
          found = 0
          for it in csv.DictReader(open("probe/items.csv", encoding="utf-8")):
              cands, how = [], ""
              for key, src in ((n(it["article"]), "trade"), (n(it["code"]), "art")):
                  if len(key) < 3: continue
                  hit = idx_trade.get(key, []) + idx_art.get(key, [])
                  if hit: cands, how = hit, src; break
              if not cands and len(n(it["code"])) >= 5:
                  k = n(it["code"]); cands = [r for r in rows if k in n(r[3])][:3]; how = "code-in-name"
              if not cands and len(n(it["article"])) >= 6:
                  k = n(it["article"]); cands = [r for r in rows if k in n(r[3])][:3]; how = "art-in-name"
              if cands: found += 1
              best = "; ".join(f"[{r[0]}] {r[4]} | {r[14]} | {r[5]} | розн {r[8]} опт {r[9]} | ост {r[6]} | {r[7]}" for r in cands[:2])
              print(f"{it['pos']:5} {it['article'][:30]:30} {it['unit']:5} -> {how or 'НЕТ':12} {best[:260]}")
          print("FOUND", found)
          PY
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add probe/match.txt && git commit -m "probe match results" && git push
